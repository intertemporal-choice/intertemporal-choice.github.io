# This file was created automatically with `myst init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: ''

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      # The uv-locked mystmd wrapper needs Node >= 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked environment (MyST, HARK, Jupyter kernel)
        run: uv sync --locked
      # Executes every page with a kernelspec; KeynesFriedmanModigliani.md fetches FRED data.
      - name: Build HTML Assets
        run: uv run python code/build_site.py --html --strict
      # Gates the deploy on the OUTPUT, not the build's exit code: myst build exits 0
      # on a site whose every stylesheet 404s. See code/verify_build.py.
      - name: Verify the built site is servable
        run: |
          uv run python code/verify_build.py --self-test
          uv run python code/verify_build.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
