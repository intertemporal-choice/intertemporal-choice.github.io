# This file was created automatically with `myst init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
  # Pull requests run the build and its checks; only a push to main deploys.
  pull_request:
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: ''

# Read-only by default: the build job runs pull-request code. Only deploy writes to Pages.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    # The build executes the figure notebooks that changed; a hung kernel must not hold the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The uv-locked mystmd wrapper needs Node >= 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # MyST, the Jupyter kernel and the notebooks' dependencies, all from uv.lock.
      - name: Install the locked environment
        run: uv sync --locked
      - name: Self-tests
        run: |
          uv run python code/build_site.py --self-test
          uv run python code/notebooks.py --self-test
          uv run python code/write_redirects.py --self-test
          uv run python code/verify_build.py --self-test
          uv run python code/build_pdf.py --self-test
          uv run python code/check_planned.py --self-test
          uv run python -m intertemporal_choice --self-test
      # Deferred rulings in dev/planned.md (see code/check_planned.py): what is due, or cannot
      # be checked, is reported as a warning on the run and never blocks the deploy. Only a
      # usage error (a missing file) fails the step.
      - name: Planned changes (report only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          uv run python code/check_planned.py --root . dev/planned.md --github || status=$?
          case "$status" in 0|4|5) ;; *) exit "$status" ;; esac
      # The notebooks are committed with their outputs but without the metadata Jupyter
      # rewrites on every save; see code/notebooks.py.
      - name: Notebooks are committed stripped
        run: uv run python code/notebooks.py --check
      # MyST caches executed notebooks in _build/execute, so a notebook whose code has not
      # changed is not re-run. The key covers the cell code and IC_EXEC_ENV, a hash of
      # uv.lock, src/ and data/ (see code/build_site.py); the cache key here carries the
      # same hash so a stale directory is never restored.
      - id: exec
        name: Hash what the notebooks depend on
        run: echo "env=$(uv run python code/build_site.py --print-env-hash)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: _build/execute
          key: myst-exec-${{ steps.exec.outputs.env }}-${{ github.sha }}
          restore-keys: myst-exec-${{ steps.exec.outputs.env }}-
      - name: Build HTML, executing the notebooks that changed
        run: uv run python code/build_site.py --html --strict
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: _build/execute
          key: myst-exec-${{ steps.exec.outputs.env }}-${{ github.sha }}
      # Old URLs of moved pages forward to their new ones; see code/redirects.txt.
      - name: Write redirects for moved pages
        run: uv run python code/write_redirects.py
      # Gates the deploy on the OUTPUT, not the build's exit code: myst build exits 0 on a
      # site whose every stylesheet 404s, and on a figure whose file is stale. See
      # code/verify_build.py.
      - name: Verify the built site
        run: uv run python code/verify_build.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

  deploy:
    if: github.event_name == 'push'
    needs: build
    permissions:
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
