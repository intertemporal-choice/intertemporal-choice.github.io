# This file was created automatically with `myst init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: MyST GitHub Pages Deploy
# Two flows (Chris Carroll, 2026-11-27: "I want to run lite on pushes to main, and thorough only on candidate tagged
# releases"):
#  - lite: the build job, its checks and, on main, the deploy. Runs on every push to main and every pull request.
#  - thorough: a release-candidate tag, v<date>-rcN (v2026.11.28-rc1), runs the same build job and then the pdf job,
#    which builds the book's PDF and fails on any problem in LaTeX's log. If both pass, publish-pdf releases the PDF
#    under the tag and redeploys main, so the site serves it at once (his choice, 2026-11-28). A tag never
#    deploys its own commit, which main may have moved past. Every deploy serves the latest released PDF.
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
    # and on release-candidate tags: the thorough flow
    tags: ['v*-rc*']
  # Pull requests run the build and its checks; only main deploys.
  pull_request:
  # Redeploys main: publish-pdf runs it once it has released a PDF, and it can be run by hand from the Actions tab.
  workflow_dispatch:
env:
  # `BASE_URL` determines, relative to the root of the domain, the URL that your site is served from.
  # E.g., if your site lives at `https://mydomain.org/myproject`, set `BASE_URL=/myproject`.
  # If, instead, your site lives at the root of the domain, at `https://mydomain.org`, set `BASE_URL=''`.
  BASE_URL: ''

# Read-only by default: the build job runs pull-request code. Only deploy writes to Pages.
permissions:
  contents: read
# Runs on main (pushes and redeploys) run one at a time, and a newer one replaces one still waiting, so the last
# site deployed is always main's newest commit. (With only the deploy job queued, builds ran side by side, and an
# older commit whose build was slower deployed last, over the newer site.) Each pull-request or tag run is its own
# group, so those still run side by side.
concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'pushes-to-main' || github.run_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # The version of a package release this build staged, for the release job; empty when there is none.
    outputs:
      version: ${{ steps.package.outputs.version }}
    # The build executes the figure notebooks that changed; a hung kernel must not hold the runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The uv-locked mystmd wrapper needs Node >= 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # MyST, the Jupyter kernel and the notebooks' dependencies, all from uv.lock.
      - name: Install the locked environment
        run: uv sync --locked
      - name: Self-tests
        run: |
          uv run python code/build_site.py --self-test
          uv run python code/release_package.py --self-test
          uv run python code/notebooks.py --self-test
          uv run python code/write_redirects.py --self-test
          uv run python code/verify_build.py --self-test
          uv run python code/build_pdf.py --self-test
          uv run python code/derive_bib.py --self-test
          uv run python code/export_models.py --self-test
          uv run python code/notebook_math.py --self-test
          uv run python code/check_core.py --self-test
          uv run python -m intertemporal_choice --self-test
      # The notebooks are committed with their outputs but without the metadata Jupyter
      # rewrites on every save; see code/notebooks.py.
      - name: Notebooks are committed stripped
        run: uv run python code/notebooks.py --check
      # A chapter's model, the cells of its notebook tagged `export`, is a module of the package,
      # written from the notebook and never edited by hand; see code/export_models.py.
      # A converted chapter's notebook is generated from <Chapter>_SST.ipynb, its source written
      # with the book's macros, and never edited by hand; see code/notebook_math.py.
      - name: Student notebooks match their _SST sources
        run: uv run python code/notebook_math.py --check
      - name: Models match their notebooks
        run: uv run python code/export_models.py --check
      # The package's core is what a notebook installs in Colab, and a page running Python in the
      # browser with micropip, so it must work without HARK, which the book's environment has: install
      # the core alone in a fresh environment and import every module and model. See code/check_core.py.
      - name: The package's core works without HARK
        run: uv run python code/check_core.py
      # The bibliography is derived from economics.bib in llorracc/texmf-local and never edited
      # here: a correction goes into economics.bib. See code/derive_bib.py.
      - name: Bibliography matches its source
        run: uv run python code/derive_bib.py --check
      # MyST caches executed notebooks in _build/execute, so a notebook whose code has not
      # changed is not re-run. The key covers the cell code and IC_EXEC_ENV, a hash of
      # uv.lock, src/ and data/ (see code/build_site.py); the cache key here carries the
      # same hash so a stale directory is never restored.
      - id: exec
        name: Hash what the notebooks depend on
        run: echo "env=$(uv run python code/build_site.py --print-env-hash)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: _build/execute
          key: myst-exec-${{ steps.exec.outputs.env }}-${{ github.sha }}
          restore-keys: myst-exec-${{ steps.exec.outputs.env }}-
      - name: Build HTML, executing the notebooks that changed
        run: uv run python code/build_site.py --html --strict
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: _build/execute
          key: myst-exec-${{ steps.exec.outputs.env }}-${{ github.sha }}
      # The figure notebooks that need only what Pyodide has also run in the browser, with
      # nothing installed: a JupyterLite site served at /lite/ (code/build_lite.py).
      - name: Build the in-browser notebooks (JupyterLite)
        run: >-
          uv run --no-project --with jupyterlite-core==0.8.6 --with jupyterlite-pyodide-kernel==0.8.6
          --with jupyter-server==2.21.1 --with jupyterlab_widgets==3.0.17
          python code/build_lite.py _build/html/lite
      # Old URLs of moved pages forward to their new ones; see code/redirects.txt.
      - name: Write redirects for moved pages
        run: uv run python code/write_redirects.py
      # The book's package, published as permanent files at /packages/ (Chris Carroll, 2026-11-13: "a
      # package file on the book's site", "not on pypi", "automatic"). Copy the files the `packages` branch
      # keeps into the site with their list page, checking that none the live site serves is dropped; on a
      # push to main that changed the package, build the next release for the release job; on a pull
      # request, only check that it builds. See code/release_package.py.
      - id: package
        name: Stage the package files
        run: >-
          uv run python code/release_package.py stage _build/html/packages
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--release _release' || '' }}
      - name: Hand the new release to the release job
        if: steps.package.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-release
          path: _release/
          if-no-files-found: error
          retention-days: 7
      # Gates the deploy on the OUTPUT, not the build's exit code: myst build exits 0 on a
      # site whose every stylesheet 404s, and on a figure whose file is stale. See
      # code/verify_build.py.
      - name: Verify the built site
        run: uv run python code/verify_build.py
      # The book's PDF, which only the thorough flow builds: a deploy serves the latest GitHub Release's copy at
      # /intertemporal-choice.pdf, so a lite deploy keeps it. Before the first release there is none to serve; once
      # there is one, failing to fetch it fails the build, so a deploy never drops the PDF the site serves.
      - name: Add the latest released PDF to the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq length)
          if [ "$releases" = "0" ]; then
            echo "::warning::no release of the book's PDF yet, so the site serves none; tag a release candidate to make one"
            exit 0
          fi
          gh release download --repo "$GITHUB_REPOSITORY" --pattern intertemporal-choice.pdf --dir _build/html
          echo "serving the PDF of release $(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

  # The only job that can write to the repository, and it writes only the `packages` branch: it adds the
  # release the build staged, one wheel and its line in releases.txt, and refuses to replace or delete
  # a file there. See code/release_package.py.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: package-release
          path: _release
      - name: Add the release to the packages branch
        run: python3 code/release_package.py publish _release

  deploy:
    # After the release job when there is one, and only if it kept the release: the site never serves a
    # package file that the `packages` branch does not keep.
    needs: [build, release]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !cancelled() && needs.build.result == 'success'
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    permissions:
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The thorough flow's PDF, on a release-candidate tag only, once the build and its checks have passed. TeX comes from
  # Ubuntu 24.04's packages: TeX Live 2023, the release the PDF is checked with by hand, which has everything the
  # PDF uses (MyST's plain_latex_book template, Latin Modern). code/build_pdf.py --strict fails on a LaTeX error,
  # an undefined reference or citation, a label defined twice, an overfull line or page, or a character a font lacks.
  pdf:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A candidate is a commit on main: the site is main, so a PDF from anywhere else would not match it.
      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME tags ${GITHUB_SHA::7}, which is not on main; tag a commit on main"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install TeX
        run: >-
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends
          texlive-xetex texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern latexmk
      - name: Install the locked environment
        run: uv sync --locked
      - name: Build the PDF, failing on any problem in LaTeX's log
        run: uv run python code/build_pdf.py --strict
      - name: Keep the logs with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-logs
          path: |
            exports/intertemporal-choice_pdf_tex/intertemporal-choice.log
            _build/pdf-src-myst.log
            _build/pdf-src-latexmk.log
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: exports/intertemporal-choice.pdf
          if-no-files-found: error
          retention-days: 7

  # A candidate that passed: its PDF becomes the GitHub Release for its tag, marked latest, and main is redeployed so
  # the site serves it at once. Running the flow again on the same tag replaces the release's PDF.
  publish-pdf:
    needs: pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book-pdf
      - name: Release the PDF under the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" intertemporal-choice.pdf --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" intertemporal-choice.pdf --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "$GITHUB_REF_NAME" --notes "The book as a PDF, built from ${GITHUB_SHA::7} and checked by the thorough flow."
          fi
      - name: Redeploy main, so the site serves the new PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
