# This file was created automatically with `myst init --gh-pages` 🪄 💚
# Ensure your GitHub Pages settings for this repository are set to deploy with **GitHub Actions**.

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
  # Pull requests run the build and its checks. A push to main deploys, as does a run
  # started by hand from main (the Actions tab, or `gh workflow run`).
  pull_request:
  workflow_dispatch:
env:
  # `BASE_URL` is the folder of the domain the site is served from, and it follows from
  # the repository's name. The public repository, intertemporal-choice.github.io, serves
  # the root of the domain: https://intertemporal-choice.github.io. Any other repository
  # in the organisation is served from a folder named after it, so the private source
  # repository, intertemporal-choice.github.io-source, publishes its preview of the next
  # release at https://intertemporal-choice.github.io/intertemporal-choice.github.io-source/.
  # The same file therefore serves both repositories unchanged; code/publish.py copies it.
  BASE_URL: ${{ github.event.repository.name != 'intertemporal-choice.github.io' && format('/{0}', github.event.repository.name) || '' }}

# Read-only by default: the build job runs pull-request code. Only deploy writes to Pages.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install MyST
        run: npm install -g mystmd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # A preview build (BASE_URL names a folder) gets a banner on every page, through the
      # theme; the published book (BASE_URL empty) is built exactly as committed. See
      # code/mark_preview.py.
      - name: Configure a preview build
        run: |
          python code/mark_preview.py --self-test
          python code/mark_preview.py
      - name: Build HTML Assets
        run: myst build --html --strict
      # Old URLs of moved pages forward to their new ones; see code/redirects.txt.
      - name: Write redirects for moved pages
        run: |
          python code/write_redirects.py --self-test
          python code/write_redirects.py
      # The published book's robots.txt tells search engines to skip the preview folder.
      - name: Keep search engines off the preview
        run: |
          python code/write_robots.py --self-test
          python code/write_robots.py
      # Gates the deploy on the OUTPUT, not the build's exit code: myst build exits 0
      # on a site whose every stylesheet 404s. See code/verify_build.py.
      - name: Verify the built site is servable
        run: |
          python code/verify_build.py --self-test
          python code/verify_build.py
      # The script that copies the source repository into the public one; see code/publish.py.
      - name: Self-test the publish script
        run: python code/publish.py --self-test
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    permissions:
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
