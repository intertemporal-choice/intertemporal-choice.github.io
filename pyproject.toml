[project]
name = "intertemporal-choice"
version = "0.1.0"
description = "Graduate macroeconomics lecture notes on consumption, saving, growth, and asset pricing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC-BY-NC-ND-4.0 (content), Apache-2.0 (code)"}
authors = [
    {name = "Christopher D. Carroll", email = "ccarroll@jhu.edu"},
    {name = "Alan E. Lujan Solis"},
]
dependencies = [
    "econ-ark>=0.17.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter-server>=2.21.0",
    "jupyterlab>=4.5.2",
    "jupytext>=1.18.1",
    "matplotlib>=3.11.1",
    "mystmd>=1.10.1",
    "numpy>=2.3.5",
    "pyyaml>=6.0.3",
    "scipy>=1.17.0",
    # econ-ark 0.17.2 imports sympy without declaring it, so a fresh install of the book's
    # package (Colab, Binder, a downloaded notebook) failed at `import HARK...`. Drop this once
    # an econ-ark release declares it.
    "sympy>=1.14.0",
    # The Aiyagari chapter's notebook computes its figures and numbers with the code of Econ-ARK's
    # Aiyagari1994QJE REMARK, pinned to the commit of its v1.1.0 tag. A direct-URL dependency keeps
    # this package off PyPI; if it ever goes there, the REMARK's package goes first.
    "aiyagari1994qje @ git+https://github.com/econ-ark/Aiyagari1994QJE@66ae8be37402a223ca789363191cca243b8f7324",
]

# The figure notebooks import shared code from src/intertemporal_choice/, which `uv sync`
# installs editable into the book's environment, and which a downloaded notebook installs
# from GitHub with pip (see the first cell of any notebook).
[build-system]
requires = ["uv_build>=0.8.13,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
