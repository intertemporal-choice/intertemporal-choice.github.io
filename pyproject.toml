[project]
name = "intertemporal-choice"
# What an install from GitHub reports. A release published on the book's site gets its own version, the
# date and a counter (2026.11.14.1), from code/release_package.py.
version = "0.1.0"
description = "Graduate macroeconomics lecture notes on consumption, saving, growth, and asset pricing"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "CC-BY-NC-ND-4.0 (content), Apache-2.0 (code)"}
authors = [
    {name = "Christopher D. Carroll", email = "ccarroll@jhu.edu"},
    {name = "Alan E. Lujan Solis"},
]
# The core: what the chapters' notebooks and models need, except HARK's. A notebook opened in Colab or
# Binder installs it with pip (see the first cell of any notebook), and it is pure Python, so a page
# running Python in the browser installs it too (micropip, in JupyterLite and the keys' browser pages).
# Nothing in the core may import HARK, which needs numba, which the browser's Python lacks: CI
# installs the core alone in a fresh environment and imports every module and model
# (code/check_core.py). A new heavy need becomes a new add-on below, never a core dependency.
#
# The minimums are ones Colab already meets (numpy 2.1, scipy 1.16, matplotlib 3.10, ipywidgets
# 7.7, pandas 2.2 in October 2026), so that pip adds what is missing without upgrading what Colab
# has loaded. Upgrading numpy under a running Colab kernel broke every notebook there until the
# runtime was restarted (`ImportError: cannot import name '_slice' from 'numpy._core.umath'`), and
# upgrading ipykernel and ipywidgets breaks Colab's own kernel and widgets. The book's own
# environment is the `book` group below, with the versions uv.lock pins.
dependencies = [
    "ipywidgets>=7.6",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.11",
]

# `pip install "intertemporal-choice[hark] @ <address>"`: the core and HARK, for the chapters and
# questions that use it (Aiyagari), run in Colab or locally, never in the browser.
[project.optional-dependencies]
hark = [
    # HARK is pinned to the commit whose tools the book uses, not to a release (Chris Carroll, 2026-11-21:
    # "we should not be locked into 0.17.2"). Now: econ-ark/HARK main at the merge of #1888, the closed
    # forms for the MPC at target and at m = 0 that TractableBufferStock's notebook uses. When a chapter
    # needs a pull request not yet merged, pin HARK's development fork, llorracc/HARK, where each pull
    # request is a branch, at a commit that one of the fork's choice-book/ tags keeps.
    "econ-ark @ git+https://github.com/econ-ark/HARK@57276c75a60d01a4a48ce4dcb1abefbaae8c3a97",
    # econ-ark 0.17.2 imports sympy without declaring it, so a fresh install of the book's
    # package (Colab, Binder, a downloaded notebook) failed at `import HARK...`. Drop this once
    # an econ-ark release declares it.
    "sympy>=1.14.0",
    # The Aiyagari chapter's notebook computes its figures and numbers with the code of Econ-ARK's
    # Aiyagari1994QJE REMARK, pinned to the commit of its v1.1.1 tag. PyPI refuses a package with
    # a direct-URL dependency, even in an add-on; this package is published as files on the
    # book's site instead (Chris Carroll, 2026-11-13: "not on pypi").
    "aiyagari1994qje @ git+https://github.com/econ-ark/Aiyagari1994QJE@e109e8f7c0c92d76337eb2da3a1b44e7abd5c91f",
]

# The figure notebooks import shared code from src/intertemporal_choice/, which `uv sync`
# installs editable into the book's environment, and which a downloaded notebook installs
# from GitHub with pip (see the first cell of any notebook).
[build-system]
requires = ["uv_build>=0.8.13,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
# The tools that build the book, and the minimums its own environment keeps. The book runs every
# chapter's notebook, Aiyagari's included, so its environment has the HARK add-on.
book = [
    "intertemporal-choice[hark]",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "jupyter-server>=2.21.0",
    "jupyterlab>=4.5.2",
    "jupytext>=1.18.1",
    "matplotlib>=3.11.1",
    "mystmd>=1.10.1",
    "numpy>=2.3.5",
    "pyyaml>=6.0.3",
    "scipy>=1.17.0",
]

[tool.uv]
default-groups = ["dev", "book"]
