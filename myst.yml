# See docs at: https://mystmd.org/guide/frontmatter
version: 1

# Import external configuration files
# See https://mystmd.org/guide/configuration#compose-and-extend-configuration-yml-files
extends:
  - macros.yml # LaTeX math macros (extracted from econtexShortcuts.sty)
  - toc.yml # Table of contents

project:
  id: 33d6fdec-239b-42b2-b545-e58f5177428a
  title: A Gentle Introduction to Intertemporal Choice
  short_title: Intertemporal Choice
  description: >-
    Graduate macroeconomics lecture notes covering consumption theory, asset pricing,
    investment theory, growth models, and DSGE frameworks. Developed for advanced
    economics courses at Johns Hopkins University.
  subject: Macroeconomics
  keywords:
    - macroeconomics
    - intertemporal choice
    - consumption theory
    - asset pricing
    - growth theory
    - DSGE models
    - investment theory
    - Euler equation
    - dynamic optimization
  tags:
    - graduate economics
    - lecture notes
    - dynamic macroeconomics
    - computational economics

  # Thumbnail for social media previews (create this file for link previews)
  # thumbnail: thumbnails/intertemporal-choice.png

  license:
    content: CC-BY-4.0
    code: Apache-2.0
  open_access: true

  # Affiliations defined separately for reuse
  affiliations:
    - id: jhu-econ
      institution: Johns Hopkins University
      department: Department of Economics
      city: Baltimore
      state: Maryland
      country: United States
      ror: https://ror.org/00za53h95
      url: https://econ.jhu.edu
    - id: jhu-ksas
      institution: Johns Hopkins University
      department: Krieger School of Arts and Sciences
      city: Washington
      state: District of Columbia
      country: United States
      ror: https://ror.org/00za53h95
      url: https://advanced.jhu.edu
    - id: econ-ark
      name: Econ-ARK
      url: https://econ-ark.org
      github: econ-ark

  authors:
    - id: ccarroll
      name:
        given: Christopher D.
        surname: Carroll
      email: ccarroll@jhu.edu
      corresponding: true
      affiliations:
        - jhu-econ
        - econ-ark
      url: https://www.econ2.jhu.edu/people/ccarroll/
      orcid: 0000-0003-3732-9312
      github: llorracc
      roles:
        - Conceptualization
        - Writing – original draft
        - Supervision
        - Funding acquisition
    - id: alujan
      name:
        given: Alan E.
        surname: Lujan Solis
      affiliations:
        - jhu-ksas
        - econ-ark
      github: alanlujan91
      email: alujan@jhu.edu
      orcid: 0000-0002-5289-7054
      corresponding: true
      roles:
        - Software
        - Writing – review & editing
        - Project administration

  # Reviewers and editors (if applicable)
  # reviewers:
  #   - name: Reviewer Name
  # editors:
  #   - name: Editor Name

  venue:
    title: Johns Hopkins University
    short_title: JHU
    url: https://www.jhu.edu/

  funding:
    - statement: >-
        Development of these materials has been supported by the Econ-ARK project,
        funded by the Alfred P. Sloan Foundation.
      open_access: These materials are freely available under open access terms.
      awards:
        - id: sloan-econ-ark
          name: Econ-ARK Infrastructure Development
          sources:
            - name: Alfred P. Sloan Foundation
              url: https://sloan.org
          investigators:
            - ccarroll
          recipients:
            - ccarroll
            - alujan

  github: https://github.com/jhu-econ/intertemporal-choice

  # Social links for the project
  social:
    github: jhu-econ/intertemporal-choice
    # twitter: mystmarkdown

  bibliography:
    - content/minimal_bibliography.bib

  # Exports configuration for PDF/LaTeX generation
  exports:
    - format: pdf
      template: plain-latex-book
      output: exports/intertemporal-choice.pdf
    - format: tex
      output: exports/intertemporal-choice-tex/

  # Exclude patterns (TOC-listed files are still built even if matched)
  # sources/ contains LaTeX originals, exports/ is build output
  exclude:
    - "sources/**"
    - "_build/**"
    - "exports/**"

  error_rules:
    - rule: image-exists
      severity: warn
    - rule: citation-exists
      severity: warn
    - rule: link-exists
      severity: warn
    - rule: xref-target-not-found
      severity: warn

  # Numbering configuration
  numbering:
    headings: true
    equations: true
    figures: true
    tables: true

  # Abbreviations used throughout the text
  abbreviations:
    CRRA: Constant Relative Risk Aversion
    CARA: Constant Absolute Risk Aversion
    DSGE: Dynamic Stochastic General Equilibrium
    RBC: Real Business Cycle
    OLG: Overlapping Generations
    FOC: First Order Condition
    MPC: Marginal Propensity to Consume
    PDV: Present Discounted Value
    C-CAPM: Consumption Capital Asset Pricing Model
    RCK: Ramsey-Cass-Koopmans

site:
  template: book-theme
  title: Intertemporal Choice

  # Site options for book-theme
  # See https://mystmd.org/guide/website-templates#site-options
  options:
    # Branding
    # favicon: favicon.ico
    # logo: site_logo.png
    # logo_dark: site_logo_dark.png
    logo_text: Intertemporal Choice

    # Navigation behavior
    hide_toc: false # Show table of contents in primary sidebar
    hide_outline: false # Show document outline in secondary sidebar
    hide_footer_links: false # Show previous/next links in footer
    hide_title_block: false # Show document title on pages
    hide_search: false # Enable search functionality
    outline_maxdepth: 3 # Show up to H3 in document outline

    # URL structure
    folders: true # Respect nested folder structure in URLs

    # References style
    numbered_references: false # Use APA-style citations (not numbered)

    # Analytics (uncomment and add your keys to enable)
    # analytics_google: G-XXXXXXXXXX
    # analytics_plausible: your-domain.com

    # Custom CSS (uncomment to add custom styles)
    # style: css/custom.css

  # Top-level navigation links in header
  # See https://mystmd.org/guide/website-navigation
  nav:
    - title: Econ-ARK
      url: https://econ-ark.org
    - title: JHU Applied Economics
      url: https://advanced.jhu.edu/academics/graduate/ms-applied-economics/
    - title: JHU Economics
      url: https://econ.jhu.edu

  # Action buttons in header
  actions:
    - title: GitHub
      url: https://github.com/jhu-econ/intertemporal-choice

  # Site parts for custom footer and sidebar
  # See https://mystmd.org/guide/document-parts#add-website-parts
  parts:
    footer: |
      Built with [MyST Markdown](https://mystmd.org) • 
      Part of the [Econ-ARK](https://econ-ark.org) ecosystem • 
      [Johns Hopkins University](https://www.jhu.edu)
    # primary_sidebar_footer: sidebar-footer.md
